name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis"
          - os: ubuntu-22.04
            bundles: "appimage deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxtst-dev libxi-dev pkg-config cmake

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build
        working-directory: desktop/src-tauri
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkable-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Talkable.app
        working-directory: macos
        run: ./scripts/make_app.sh

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent macos/build/Talkable.app Talkable-macOS.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talkable-macos-latest
          path: Talkable-macOS.zip
          if-no-files-found: error
