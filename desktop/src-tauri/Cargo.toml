[package]
name = "talkable"
version = "0.3.0"
description = "Free, private, local voice dictation"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
whisper-rs = "0.16"
enigo = "0.6"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
dirs = "5"

[profile.release]
strip = true
lto = true
