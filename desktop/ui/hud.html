<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Talkable</title>
<style>
  /* "Liquid glass" card. The window itself is transparent; the margin around
     #card leaves room for its soft shadow. The tint is opaque enough to stay
     readable even where the platform can't blur what's behind the window. */
  :root {
    color-scheme: light dark;
    --glass: rgba(250, 250, 252, 0.80);
    --glass-edge: rgba(255, 255, 255, 0.75);
    --glass-rim: rgba(0, 0, 0, 0.10);
    --sheen: rgba(255, 255, 255, 0.55);
    --ink: #1d1d1f;
    --ink-soft: rgba(29, 29, 31, 0.62);
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.16), 0 1px 3px rgba(0, 0, 0, 0.10);
    --accent: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass: rgba(30, 30, 34, 0.74);
      --glass-edge: rgba(255, 255, 255, 0.22);
      --glass-rim: rgba(0, 0, 0, 0.35);
      --sheen: rgba(255, 255, 255, 0.10);
      --ink: #f5f5f7;
      --ink-soft: rgba(245, 245, 247, 0.65);
      --shadow: 0 8px 26px rgba(0, 0, 0, 0.40), 0 1px 3px rgba(0, 0, 0, 0.30);
    }
  }
  /* State accents: only the dot and a faint tint, never a solid fill. */
  .recording { --accent: #ff453a; }
  .busy { --accent: #0a84ff; }
  .done { --accent: #30d158; }
  .error { --accent: #ff9f0a; }

  * { box-sizing: border-box; user-select: none; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text",
      "Segoe UI", Ubuntu, Cantarell, "Noto Sans", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #card {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    width: calc(100% - 24px); height: calc(100% - 24px);
    margin: 12px; padding: 12px 18px;
    border-radius: 24px;
    /* Plain fallback for engines without color-mix() (older WebKitGTK). */
    background: var(--glass);
    background:
      linear-gradient(180deg, var(--sheen), transparent 55%),
      radial-gradient(120% 140% at 0% 50%,
        color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      var(--glass);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow), inset 0 0 0 0.5px var(--glass-rim),
      inset 0 1px 0 var(--sheen);
    color: var(--ink); font-size: 14px; line-height: 1.35;
    transition: background 0.25s ease;
  }
  #dot {
    flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent),
      0 0 10px color-mix(in srgb, var(--accent) 55%, transparent);
  }
  /* Two lines at most. Status messages show their start; live preview text
     is bottom-aligned so the latest words stay visible as it grows. */
  #text {
    flex: 1 1 auto; min-width: 0;
    max-height: calc(1.35em * 2);
    display: flex; flex-direction: column; justify-content: flex-start;
    overflow: hidden; overflow-wrap: anywhere;
  }
  #text.live { justify-content: flex-end; }
  #line {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  #text.live #line { display: block; overflow: visible; }
  .busy #text, .recording #text:not(.live) { color: var(--ink-soft); }
  .recording #dot, .busy #dot { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .recording #dot, .busy #dot { animation: none; }
  }
</style>
</head>
<body>
  <div id="card">
    <span id="dot"></span>
    <div id="text"><span id="line">Ready</span></div>
  </div>
<script>
  const { listen } = window.__TAURI__.event;
  const root = document.body;
  const box = document.getElementById("text");
  const line = document.getElementById("line");

  function setText(message, live) {
    box.classList.toggle("live", live);
    line.textContent = message;
    box.title = message;
  }

  if (listen) {
    listen("hud-update", ({ payload }) => {
      root.className = payload.kind;
      setText(payload.text, false);
    });
    // Live preview only while recording: late previews never replace a
    // later stage or the final text.
    listen("hud-partial", ({ payload }) => {
      if (root.className === "recording" && payload.text) {
        setText(payload.text, true);
      }
    });
  }
</script>
</body>
</html>
